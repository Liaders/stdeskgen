name: statusdesk_winter_stand
description: Local non-networked StatusDesk winter sidebar prototype.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.0.10+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/win.svg
  fonts:
    - family: DeviceGroup
      fonts:
        - asset: assets/device_group.ttf

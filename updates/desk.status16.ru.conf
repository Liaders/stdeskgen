<VirtualHost *:80>
    ServerName desk.status16.ru
    RewriteEngine On
    RewriteRule ^/(.*)$ https://desk.status16.ru/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName desk.status16.ru
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/desk.status16.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/desk.status16.ru/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyTimeout 3600
    LimitRequestBody 0

    # Update files must bypass both the WebSocket proxy and the HTTP proxy.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/client(?:/|$)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:8080/$1 [P,L]

    ProxyPass /client/ !
    RedirectMatch 301 ^/client$ /client/
    Alias /client/ /srv/stdesk-updates/public/
    <Directory /srv/stdesk-updates/public/>
        Options -Indexes -ExecCGI -Includes -FollowSymLinks
        AllowOverride None
        Require all granted
        RemoveHandler .exe .json
        AddType application/octet-stream .exe
        AddType application/json .json
        Header always set X-Content-Type-Options "nosniff"
        Header always set Cache-Control "no-store"
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Existing branding of the console and its web client.
    RequestHeader unset Accept-Encoding
    <LocationMatch "^/rdclient/app\.js$">
        SetOutputFilter SUBSTITUTE
        Substitute "s|CortenDesk|StatusDesk|n"
        Substitute "s|Corten<span>Desk</span>|Status<span>Desk</span>|n"
        SubstituteMaxLineLength 10m
    </LocationMatch>

    # Never apply branding substitutions to signed metadata or installers.
    <LocationMatch "^/(?!client(?:/|$))">
        AddOutputFilterByType SUBSTITUTE text/html
        Substitute "s|CortenDesk|StatusDesk|n"
        Substitute "s|RustDesk|StatusDesk|n"
        Substitute "s|Corten<span>Desk</span>|Status<span>Desk</span>|n"
        Substitute "s|https://github.com/sponsors/marcpope|https://status16.ru|n"
        Substitute "s|Поддержать StatusDesk|Перейти на сайт|n"
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/rd-error.log
    CustomLog ${APACHE_LOG_DIR}/rd-access.log combined
</VirtualHost>

name: Test client updates
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'updates/**'
      - 'rdgenerator/**'
      - '.github/workflows/*client-update*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: generator
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: fada664df7a294d1d1a9ca3e7cd3637069122f17
          path: rustdesk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local constructor dependencies
        run: python -m pip install -r generator/requirements.txt
      - name: Test local status refresh, downloads and desktop publication API
        run: python generator/manage.py test rdgenerator --noinput
      - name: Test update packages, deployment and source adapter
        run: python -W error::ResourceWarning -m unittest discover -s generator/updates -p 'test_*.py'
      - name: Validate Apache channel configuration
        run: >-
          docker run --rm
          -v "$PWD/generator/updates/apache-client.conf:/usr/local/apache2/conf/extra/stdesk-client.conf:ro"
          httpd:2.4 httpd -t -C 'Include conf/extra/stdesk-client.conf'
      - name: Test supplied desk.status16.ru VirtualHost
        run: python generator/updates/test_apache_vhost.py

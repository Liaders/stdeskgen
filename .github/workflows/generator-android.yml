name: Custom Android Client Generator
run-name: Local Android build ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: 1.5.1
      app_version:
        type: string
        required: true
      config_ref:
        type: string
        required: true
      config_secret:
        type: string
        required: true
      request_id:
        type: string
        required: true
      architecture:
        type: choice
        required: false
        default: all
        options:
        - all
        - arm64
        - armv7
        - x64
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  FLUTTER_VERSION: 3.24.5
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VERSION: ${{ inputs.version }}
  STDESK_DISPLAY_VERSION: ${{ inputs.app_version }}
  RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      config_ref: ${{ inputs.config_ref }}
  bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}
  android:
    needs:
    - setup
    - bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"arch":"arm64","abi":"arm64-v8a","target":"aarch64-linux-android","flutter_target":"android-arm64","ndk_triple":"aarch64-linux-android"}]'
          || inputs.architecture == 'armv7' && '[{"arch":"armv7","abi":"armeabi-v7a","target":"armv7-linux-androideabi","flutter_target":"android-arm","ndk_triple":"arm-linux-androideabi"}]'
          || inputs.architecture == 'x64' && '[{"arch":"x64","abi":"x86_64","target":"x86_64-linux-android","flutter_target":"android-x64","ndk_triple":"x86_64-linux-android"}]' || '[{"arch":"arm64","abi":"arm64-v8a","target":"aarch64-linux-android","flutter_target":"android-arm64","ndk_triple":"aarch64-linux-android"},{"arch":"armv7","abi":"armeabi-v7a","target":"armv7-linux-androideabi","flutter_target":"android-arm","ndk_triple":"arm-linux-androideabi"},{"arch":"x64","abi":"x86_64","target":"x86_64-linux-android","flutter_target":"android-x64","ndk_triple":"x86_64-linux-android"}]')
          }}
    steps:
    - name: Checkout generator
      uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: encrypted-secrets-zip
    - name: Load encrypted configuration
      uses: ./.github/actions/decrypt-secrets
      with:
        zip_password: ${{ secrets[inputs.config_secret] }}
    - name: Preserve local adapters
      shell: python
      run: 'import os, shutil

        from pathlib import Path

        shutil.copytree(''customization'',Path(os.environ[''RUNNER_TEMP''])/''rdgen-tools'',dirs_exist_ok=True)

        shutil.copyfile(''.github/scripts/ubuntu_apt.py'',Path(os.environ[''RUNNER_TEMP''])/''rdgen-tools''/''ubuntu_apt.py'')'
    - name: Checkout RustDesk
      uses: actions/checkout@v4
      with:
        repository: rustdesk/rustdesk
        ref: refs/tags/${{ inputs.version }}
        submodules: recursive
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Configure Ubuntu package mirror
      timeout-minutes: 3
      run: sudo python3 "$RUNNER_TEMP/rdgen-tools/ubuntu_apt.py"
    - name: Install dependencies
      run: "sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30 update\nsudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2\
        \ -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30 install -y --no-install-recommends \\\n     clang \\\n     cmake \\\n     curl \\\n     gcc-multilib \\\n     git\
        \ \\\n     g++ \\\n     g++-multilib \\\n     imagemagick \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev \\\n     libclang-dev \\\n     libunwind-dev\
        \ \\\n     libgstreamer1.0-dev \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n     libpam0g-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libvdpau-dev\
        \ \\\n     libxcb-randr0-dev \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build\
        \ \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n     wget\n\nsudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30\
        \ -o Acquire::http::Timeout=30 install -y --no-install-recommends potrace\n"
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android SDK platform and build tools
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"'
    - name: Install Android NDK
      id: ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28c
        add-to-path: true
    - name: Set NDK environment
      run: 'echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

        echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"'
    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: '1.75'
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        prefix-key: statusdesk-android-${{ inputs.version }}
        key: ${{ matrix.target }}
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Restore native dependency cache
      uses: actions/cache@v4
      with:
        path: /opt/artifacts/vcpkg/installed
        key: statusdesk-android-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.target }}
    - name: Prepare Android source and branding
      run: python3 "$RUNNER_TEMP/rdgen-tools/prepare_android.py" --source .
    - name: Restore generated bridge
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Build native dependencies
      run: ./flutter/build_android_deps.sh "${{ matrix.abi }}"
    - name: Generate launcher icons
      if: env.iconlink_url != 'false'
      working-directory: flutter
      run: 'flutter pub get

        dart run flutter_launcher_icons'
    - name: Apply supplied Android launcher resource bundle
      run: python3 "$RUNNER_TEMP/rdgen-tools/android_branding.py" --source .
    - name: Verify server settings and branding
      run: python3 "$RUNNER_TEMP/rdgen-tools/verify_build_inputs.py" --source . --platform android
    - name: Build native library
      run: 'cargo install cargo-ndk --version 3.1.2 --locked

        cargo ndk --platform 21 --target "${{ matrix.target }}" build --locked --release --features flutter,hwcodec

        mkdir -p "flutter/android/app/src/main/jniLibs/${{ matrix.abi }}"

        cp "target/${{ matrix.target }}/release/liblibrustdesk.so" "flutter/android/app/src/main/jniLibs/${{ matrix.abi }}/librustdesk.so"

        cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.ndk_triple }}/libc++_shared.so" "flutter/android/app/src/main/jniLibs/${{ matrix.abi }}/libc++_shared.so"

        '
    - name: Build APK for local signing
      working-directory: flutter
      run: 'flutter build apk --release --target-platform "${{ matrix.flutter_target }}" --build-name "$stdesk_display_version" --build-number "$stdesk_android_version_code"

        '
    - name: Collect and audit unsigned APK
      env:
        STDESK_ANDROID_ABI: ${{ matrix.abi }}
      run: python3 "$RUNNER_TEMP/rdgen-tools/audit_android_apk.py" --source .
    - uses: actions/upload-artifact@v4
      with:
        name: client-android-${{ matrix.arch }}
        path: android-output/*
        if-no-files-found: error
        retention-days: 14
  cleanup:
    needs:
    - android
    - bridge
    - setup
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
    - uses: geekyeggo/delete-artifact@v5
      with:
        name: encrypted-secrets-zip
      continue-on-error: true

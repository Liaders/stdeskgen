name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string
      config_ref:
        type: string
        required: false
        default: ''

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch encrypted local input
        if: ${{ inputs.config_ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.config_ref }}
          path: incoming
          sparse-checkout: build-input.zip
          sparse-checkout-cone-mode: false
      - name: Use local input archive
        if: ${{ inputs.config_ref != '' }}
        run: cp incoming/build-input.zip secrets.zip
      - name: Download with Retry
        if: ${{ inputs.config_ref == '' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import json
            import time

            input_data = json.loads('${{ inputs.zip_url_json }}')
            url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
name: Test supported RustDesk versions
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'customization/**'
      - 'updates/**'
      - '.github/workflows/test-source-versions.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        source:
          - {version: '1.5.0', ref: 'fada664df7a294d1d1a9ca3e7cd3637069122f17'}
          - {version: '1.5.1', ref: '23e5bb471a040d62f0a6ad52591fb30784265b73'}
    steps:
      - uses: actions/checkout@v4
        with:
          path: generator
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ matrix.source.ref }}
          path: rustdesk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check UI adapter source compatibility
        run: python generator/customization/apply_profile.py --source rustdesk --version '${{ matrix.source.version }}' --profile generator/customization/example.json --check
      - name: Test display versions and disabling upstream notifications
        run: python -m unittest discover -s generator/customization -p test_version.py
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Test relay retry compatibility and transport error classification
        run: |
          python -m unittest discover -s generator/customization -p test_relay_retry.py
          rustc --edition=2021 --test generator/customization/relay_retry.rs -o "$RUNNER_TEMP/relay-retry-tests"
          "$RUNNER_TEMP/relay-retry-tests"
      - name: Checkout shared configuration source for Android adapter
        working-directory: rustdesk
        run: git submodule update --init libs/hbb_common
      - name: Test Android configuration and package versions
        run: python -m unittest discover -s generator/customization -p 'test_android*.py'
      - name: Test theme logo packaging and runtime source compatibility
        run: python -m unittest discover -s generator/customization -p test_theme_logos.py
      - name: Test desktop branding and local ID actions
        run: python -m unittest discover -s generator/customization -p test_desktop_chrome.py
      - name: Test desktop text and icon navigation switch
        run: python -m unittest discover -s generator/customization -p test_navigation.py
      - name: Test session title rules and desktop source compatibility
        run: python -m unittest discover -s generator/customization -p test_session_titles.py
      - name: Test opt-in Slim UI and unchanged local-ID sidebar
        run: python -m unittest discover -s generator/customization -p test_slim_ui.py
      - name: Test organizations groups-only view and tab preference migration
        run: python -m unittest discover -s generator/customization -p test_organizations.py
      - name: Test Sciter account response and Windows window icon
        run: python -m unittest discover -s generator/customization -p test_sciter_compat.py
      - name: Test branded Linux DRM library staging
        run: python -m unittest discover -s generator/customization -p test_linux_packaging.py
      - name: Test ARM64 AppImage local Ubuntu archive keys
        run: python -m unittest discover -s generator/customization -p test_appimage_keys.py
      - name: Test independent update adapter and publication
        env:
          RUSTDESK_TEST_REF: ${{ matrix.source.ref }}
        run: python -m unittest discover -s generator/updates -p test_updates.py

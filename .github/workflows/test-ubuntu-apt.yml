name: Test Ubuntu build prerequisites
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - '.github/scripts/*ubuntu_apt*'
      - '.github/workflows/test-ubuntu-apt.yml'
      - '.github/workflows/bridge.yml'
permissions:
  contents: read
jobs:
  prerequisites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test DNS failure fallback and preserved APT trust
        run: python3 -m unittest discover -s .github/scripts -p test_ubuntu_apt.py
      - name: Configure reachable Ubuntu mirrors
        timeout-minutes: 3
        run: sudo python3 .github/scripts/ubuntu_apt.py
      - name: Install the shared bridge prerequisites
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

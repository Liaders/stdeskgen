name: Publish StatusDesk update
run-name: Publish locally signed StatusDesk update ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Draft release containing the locally signed package'
        type: string
        required: true
      asset_id:
        description: 'Signed package asset ID'
        type: string
        required: true
      package_sha256:
        description: 'SHA-256 of the locally signed ZIP'
        type: string
        required: true
      deploy:
        description: 'Publish to desk.status16.ru/client (requires configured SSH secrets)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-stdesk-update
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyNaCl==1.6.0 requests==2.32.5
      - name: Fetch and verify locally signed package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STDESK_UPDATE_PUBLIC_KEY: ${{ vars.STDESK_UPDATE_PUBLIC_KEY }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_ID: ${{ inputs.asset_id }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: python updates/fetch_signed_bundle.py --release-id "$RELEASE_ID" --asset-id "$ASSET_ID" --sha256 "$PACKAGE_SHA256" --output bundle
      - uses: actions/upload-artifact@v4
        with:
          name: signed-client-update
          path: bundle/
          retention-days: 30
          if-no-files-found: error
      - name: Publish through SSH
        if: inputs.deploy
        env:
          STDESK_UPDATE_HOST: ${{ secrets.STDESK_UPDATE_HOST }}
          STDESK_UPDATE_USER: ${{ secrets.STDESK_UPDATE_USER }}
          STDESK_UPDATE_SSH_KEY: ${{ secrets.STDESK_UPDATE_SSH_KEY }}
          STDESK_UPDATE_KNOWN_HOSTS: ${{ secrets.STDESK_UPDATE_KNOWN_HOSTS }}
        run: python updates/upload.py bundle
